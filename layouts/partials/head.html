<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>{{ .Title }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}" />
<meta name="theme-color" content="{{ site.Params.themeColor }}" />

<!-- OpenGraph / Social Meta Tags -->
<meta property="og:type" content="website" />
<meta property="og:url" content="{{ .Permalink }}" />
<meta property="og:title" content="{{ .Title }}" />
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}" />
<meta property="og:site_name" content="{{ site.Params.legalName }}" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ .Title }}" />
<meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}" />

<!-- Fonts Preconnect -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<!-- Favicon SVG -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'%3E%3Cpath d='M21.5 0 L21.5 19.5 L31.5 19.5 L31.5 29 L10 48.5 L10 28.5 L0.5 28.5 L0.5 18.5 Z' fill='%23542bff' transform='scale(0.65)'/%3E%3Crect x='1' y='12' width='6' height='7' fill='%2300f2fe'/%3E%3C/svg%3E" />

<!-- Compiled & Minified SCSS via Hugo Pipes -->
{{ $scssOptions := dict "targetPath" "css/main.css" "outputStyle" "compressed" }}
{{ $style := resources.Get "scss/main.scss" | toCSS $scssOptions | minify | fingerprint }}
<link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}" />

<!-- Site Infrastructure Data for Client Reactivity -->
<script>
  window.__JULZ_DATA__ = {{ hugo.Data.infrastructure | jsonify | safeJS }};
</script>

<!-- Compiled & Minified JavaScript Engine -->
{{ $js := resources.Get "js/main.js" | minify | fingerprint }}
<script defer src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}"></script>
